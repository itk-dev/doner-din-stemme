# Do not edit this file! Make a pull request on changing
# github/workflows/drupal/site.yaml in
# https://github.com/itk-dev/devops_itkdev-docker if need be.

### ### Drupal
###
### Checks that site can be installed and can be updated (from base branch on
### pull request).
###
### #### Assumptions
###
### 1. A docker compose service named `phpfpm` can be run and `composer` can be
###    run inside the `phpfpm` service.
### 2. The docker setup contains a database container and other the dependent
###    services and the default settings match connection credentials for these
###    services.
### 3. The Drupal site can be installed from existing config.
###
### #### Config checks
###
### 1. Config is up to date: exporting config from a site installed from config
###    must not change anything in `config/`.
### 2. Config changed by update hooks is exported: after running database
###    updates (on pull request), the active config may only differ from the
###    config in code where the pull request itself changes config.
### 3. Config matches its schema (only if
###    [drupal/config_inspector](https://www.drupal.org/project/config_inspector)
###    is a dev requirement in `composer.json`):
###
###    ``` shell
###    docker compose run --rm phpfpm composer require --dev drupal/config_inspector
###    ```

name: Drupal

env:
  COMPOSE_USER: runner

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  install-site:
    name: Check that site can be installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create docker network
        run: |
          docker network create frontend

      - name: Start docker and install dependencies
        run: |
          docker compose pull
          docker compose up --detach

          # Important: Use --no-interaction to make https://getcomposer.org/doc/06-config.md#discard-changes have effect.
          docker compose exec --env COMPOSER_EXIT_ON_PATCH_FAILURE=1 phpfpm composer install --no-interaction

      - name: Install site
        run: |
          # Add some local settings.
          cat > web/sites/default/settings.local.php <<'EOF'
          <?php

          $settings['hash_salt'] = '${{ github.head_ref }}';
          // Do not download translations when installing modules.
          $config['locale.settings']['translation']['import_enabled'] = FALSE;
          EOF

          # Install the site from config
          docker compose exec phpfpm vendor/bin/drush site:install --existing-config --yes

      - name: Check that config is up to date
        run: |
          # Exporting a site installed from config must reproduce the config.
          docker compose exec phpfpm vendor/bin/drush config:export --yes
          git status --porcelain config/
          git diff --exit-code config/
          test -z "$(git status --porcelain config/)"

      - name: Check that config matches its schema
        # Report schema errors even if the config is not up to date.
        if: ${{ !cancelled() }}
        run: |
          if ! docker compose exec phpfpm composer show drupal/config_inspector > /dev/null 2>&1; then
            echo "::notice::drupal/config_inspector is not installed; skipping config schema check"
            exit 0
          fi
          docker compose exec phpfpm vendor/bin/drush pm:install config_inspector --yes
          docker compose exec phpfpm vendor/bin/drush config:inspect --only-error --detail

      - name: Show site URL
        run: |
          echo $(docker compose exec phpfpm vendor/bin/drush --uri=http://$(docker compose port nginx 8080) user:login)

  update-site:
    # Check updating site only on pull request.
    if: github.event_name == 'pull_request'
    name: Check that site can be updated

    # This job checks that the Drupal site can be upgraded without issues.
    #
    # We do this by
    #
    # 1. Checking out the base branch ("github.base_ref") and installing the
    #    site from scratch (using the exact same steps as the "install-site"
    #    job)
    # 2. Checking out the updated code and updating the site from the previous
    #    installation
    #
    # Notice that step 2 is NOT run with the code in our new branch, but with
    # the updated code merged on top of the target branch
    # (cf.https://github.com/actions/checkout/issues/881). This makes sure that
    # we can actually update the site after merging with the base branch.
    #
    # In some cases we run into a situation where the base site (step 1) cannot
    # be installed, e.g. if this is a new project or we're making changes that
    # require manual steps on the upgrade path, and then this jobs will fail. In
    # that case we should note this in the pull request description and document
    # the steps needed to complete the upgrade path.

    runs-on: ubuntu-latest
    steps:
      # Install site from our base ref
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}

      - name: Create docker network
        run: |
          docker network create frontend

      - name: Start docker and install dependencies
        run: |
          docker compose pull
          docker compose up --detach

          # Important: Use --no-interaction to make https://getcomposer.org/doc/06-config.md#discard-changes have effect.
          docker compose exec --env COMPOSER_EXIT_ON_PATCH_FAILURE=1 phpfpm composer install --no-interaction

      - name: Install site
        run: |
          # Add some local settings.
          cat > web/sites/default/settings.local.php <<'EOF'
          <?php

          $settings['hash_salt'] = '${{ github.head_ref }}';
          // Do not download translations when installing modules.
          $config['locale.settings']['translation']['import_enabled'] = FALSE;
          EOF

          # Install the site from config
          docker compose exec phpfpm vendor/bin/drush site:install --existing-config --yes

      - name: Show site URL
        run: |
          echo $(docker compose exec phpfpm vendor/bin/drush --uri=http://$(docker compose port nginx 8080) user:login)

      - name: Clean up root stuff
        run: |
          sudo chown -Rv $USER:$USER vendor/ web/ private-files/ || true
          sudo chmod -Rv a+w web/sites/default || true

      # Update site using our updated code.
      - uses: actions/checkout@v7
        with:
          # Keep our local settings (cf.
          # https://github.com/actions/checkout?tab=readme-ov-file#usage)
          clean: false
          # Needed to diff config against the base branch.
          fetch-depth: 0

      - name: Start docker and install dependencies
        run: |
          docker compose pull
          docker compose up --detach

          # Important: Use --no-interaction to make https://getcomposer.org/doc/06-config.md#discard-changes have effect.
          docker compose exec --env COMPOSER_EXIT_ON_PATCH_FAILURE=1 phpfpm composer install --no-interaction

      - name: Run database updates
        run: |
          docker compose exec phpfpm vendor/bin/drush updatedb --yes

      - name: Check that config changed by updates is exported
        run: |
          # After running updates, but before importing config, the active
          # config may only differ from the config in code where this pull
          # request changes the config. Any other difference comes from an
          # update hook changing config that has not been exported.
          # Collection prefixes (e.g. "language.da:") and directories are
          # stripped so names from both sides compare.
          git diff --name-only origin/${{ github.base_ref }} -- config/ \
            | sed -E 's#^.*/##; s#\.yml$##' | sort -u > changed-by-pr.txt
          docker compose exec -T phpfpm vendor/bin/drush config:status --format=json \
            | jq -r 'if type == "object" then keys[] else empty end' \
            | sed -E 's#^.*:##' | sort -u > changed-in-db.txt
          comm -23 changed-in-db.txt changed-by-pr.txt > not-exported.txt
          if [ -s not-exported.txt ]; then
            echo "::error::Active config differs from config/sync (not changed by this pull request), e.g. config changed by update hooks that has not been exported:"
            cat not-exported.txt
            exit 1
          fi

      - name: Update site
        run: |
          docker compose exec phpfpm vendor/bin/drush deploy --yes

      - name: Show site URL
        run: |
          echo $(docker compose exec phpfpm vendor/bin/drush --uri=http://$(docker compose port nginx 8080) user:login)
